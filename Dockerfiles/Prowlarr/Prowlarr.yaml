name: linuxserver-prowlarr
services:
  app:
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Asia/Manila
    image: linuxserver/prowlarr:2.3.5
    labels:
      icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/prowlarr-banner.png
    ports:
      - target: 9696
        published: "9696"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/prowlarr/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: Run 'id [USER]' for the owner of the host volume directories to get the
              UID to use here.
        - container: PGID
          description:
            en_us: Run 'id [USER]' for the owner of the host volume directories to get the
              GID to use here.
        - container: TZ
          description:
            en_us: specify a timezone to use, see this list.
    devices: []
    cap_add: []
    command: []
    networks:
      - default
    privileged: false
    container_name: ""
    hostname: ""
    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: 7828M
networks:
  default:
    name: linuxserver-prowlarr_default
x-casaos:
  architectures:
    - amd64
    - arm64
  author: WisdomSky
  category: LinuxServer.io
  description:
    en_us: Prowlarr is a indexer manager/proxy built on the popular arr .net/reactjs
      base stack to integrate with your various PVR apps. Prowlarr supports both
      Torrent Trackers and Usenet Indexers. It integrates seamlessly with
      Sonarr, Radarr, Lidarr, and Readarr offering complete management of your
      indexers with no per app Indexer setup required (we do it all).
  developer: LinuxServer.io
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/prowlarr-banner.png
  is_uncontrolled: false
  main: app
  port_map: "9696"
  store_app_id: linuxserver-prowlarr
  tagline:
    en_us: A indexer manager/proxy built on the popular arr. Net/reactjs base stack
      to integrate with your various PVR apps. Prowlarr supports both Torrent
      Trackers and Usenet Indexers. It integrates seamlessly with Sonarr,
      Radarr, Lidarr, and Readarr offering complete management of your indexers
      with no per app Indexer setup required (we do it all).
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/prowlarr-banner.png
  title:
    en_us: Prowlarr
    custom: ""
  hostname: ""
  scheme: http
  index: /
