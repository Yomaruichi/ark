name: big-bear-romm
services:
  big-bear-romm:
    cpu_shares: 90
    command: []
    container_name: big-bear-romm
    depends_on:
      big-bear-rommdb:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: 7828M
    environment:
      - DB_HOST=
      - DB_NAME=
      - DB_PASSWD=
      - DB_PORT=3306
      - DB_USER=
      - ENABLE_RESCAN_ON_FILESYSTEM_CHANGE=true
      - ENABLE_SCHEDULED_RESCAN=true
      - ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB=true
      - HASHEOUS_API_ENABLED=true
      - IGDB_CLIENT_ID=
      - IGDB_CLIENT_SECRET=
      - MOBYGAMES_API_KEY=<moby api key>
      - RETROACHIEVEMENTS_API_KEY=
      - ROMM_AUTH_SECRET_KEY=
      - SCREENSCRAPER_PASSWORD=<screenscraper password>
      - SCREENSCRAPER_USER=<screenscraper user>
      - STEAMGRIDDB_API_KEY=
    hostname: big-bear-romm
    image: rommapp/romm:4.3.2
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/romm.png
    ports:
      - mode: ingress
        target: 8080
        published: "1080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/big-bear-romm/resources
        target: /romm/resources
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/big-bear-romm/redis-data
        target: /redis-data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/big-bear-romm/library
        target: /romm/library
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/big-bear-romm/assets
        target: /romm/assets
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/big-bear-romm/config
        target: /romm/config
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/big-bear-romm/logs
        target: /romm/logs
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/Storage1/romms
        target: /romm/roms
    x-casaos:
      envs:
        - container: DB_HOST
          description:
            en_us: "Database Host:"
        - container: DB_PORT
          description:
            en_us: "Database Port:"
        - container: DB_USER
          description:
            en_us: "Database User:"
        - container: DB_NAME
          description:
            en_us: "Database Name:"
        - container: DB_PASSWD
          description:
            en_us: "Database Password:"
        - container: IGDB_CLIENT_ID
          description:
            en_us: "IGDB Client ID (Optional): Generate an ID and SECRET in IGDB"
        - container: IGDB_CLIENT_SECRET
          description:
            en_us: "IGDB Client Secret (Optional):
              https://api-docs.igdb.com/#account-creation"
        - container: MOBYGAMES_API_KEY
          description:
            en_us: "MobyGames API Key (Optional): Generate at
              https://www.mobygames.com/info/api/"
        - container: STEAMGRIDDB_API_KEY
          description:
            en_us: "SteamGridDB API Key (Optional): See
              https://github.com/rommapp/romm/wiki/Generate-API-Keys#steamgridd\
              b"
        - container: SCREENSCRAPER_USER
          description:
            en_us: "ScreenScraper User (Optional): ScreenScraper username"
        - container: SCREENSCRAPER_PASSWORD
          description:
            en_us: "ScreenScraper Password (Optional): ScreenScraper password"
        - container: RETROACHIEVEMENTS_API_KEY
          description:
            en_us: "RetroAchievements API Key (Optional): RetroAchievements API key"
        - container: HASHEOUS_API_ENABLED
          description:
            en_us: "Hasheous API Enabled (Optional): Enable Hasheous API integration"
        - container: ROMM_AUTH_SECRET_KEY
          description:
            en_us: "Authentication Secret Key: <secret key>"
        - container: ENABLE_RESCAN_ON_FILESYSTEM_CHANGE
          description:
            en_us: "Rescan On Filesystem Change: true"
        - container: ENABLE_SCHEDULED_RESCAN
          description:
            en_us: "Scheduled Rescan: true"
        - container: ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB
          description:
            en_us: "Scheduled Update Switch TitleDB: true"
      ports:
        - container: "8080"
          description:
            en_us: "Container Port: 8080"
      volumes:
        - container: /romm/resources
          description:
            en_us: "Container Path: /romm/resources"
        - container: /romm/library
          description:
            en_us: "Container Path: /romm/library"
        - container: /romm/assets
          description:
            en_us: "Container Path: /romm/assets"
        - container: /romm/config
          description:
            en_us: "Container Path: /romm/config"
        - container: /romm/logs
          description:
            en_us: "Container Path: /romm/logs"
    devices: []
    cap_add: []
    networks:
      - big-bear-romm-network
    privileged: false
  big-bear-rommdb:
    cpu_shares: 90
    command: []
    container_name: big-bear-rommdb
    deploy:
      resources:
        limits:
          memory: 7828M
    environment:
      - MYSQL_DATABASE=
      - MYSQL_PASSWORD=
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_USER=
    hostname: big-bear-rommdb
    image: mariadb:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/romm.png
    ports:
      - mode: ingress
        target: 3306
        published: "3306"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/big-bear-romm/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: true
    x-casaos:
      envs:
        - container: MYSQL_ROOT_PASSWORD
          description:
            en_us: "MySQL root password"
        - container: MYSQL_DATABASE
          description:
            en_us: "MySQL database:"
        - container: MYSQL_USER
          description:
            en_us: "MySQL user:"
        - container: MYSQL_PASSWORD
          description:
            en_us: "MySQL password:"
      ports:
        - container: "3306"
          description:
            en_us: "Container Port: 3306"
      volumes:
        - container: /var/lib/mysql
          description:
            en_us: "Container Path: /var/lib/mysql"
    devices: []
    cap_add: []
    networks:
      - big-bear-romm-network
    privileged: false
networks:
  big-bear-romm-network:
    name: big-bear-romm_big-bear-romm-network
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  author: BigBearTechWorld
  category: BigBearCasaOS
  description:
    en_us: ROM manager for organizing, enriching, and playing retro games, with
      support for 400+ platforms.
  developer: RomM Team
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/romm.png
  index: /
  is_uncontrolled: false
  main: big-bear-romm
  port_map: "1080"
  scheme: http
  store_app_id: big-bear-romm
  tagline:
    en_us: RomM
  thumbnail: ""
  tips:
    before_install:
      en_us: >
        Run this script before installing the big-bear-romm application:


        ```

        bash -c "$(wget -qLO - https://raw.githubusercontent.com/bigbeartechworld/big-bear-scripts/master/generate-romm-config/run.sh)"

        ```


        After running this script, you need to restart the container.
  title:
    custom: ""
    en_us: RomM
